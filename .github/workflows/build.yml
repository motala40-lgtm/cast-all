name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CastAll-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Decode signing keystore
        if: env.SIGNING_KEY_BASE64 != ''
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 -d > app/release.keystore

      - name: Build signed release APK
        if: env.SIGNING_KEY_BASE64 != ''
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: env.SIGNING_KEY_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: CastAll-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Build signed release AAB (for Google Play upload)
        if: env.SIGNING_KEY_BASE64 != ''
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload release AAB
        if: env.SIGNING_KEY_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: CastAll-release-aab
          path: app/build/outputs/bundle/release/*.aab
